<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Shreeji Fire Solution</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--ink:#0b0b0b;--muted:#62666b;--line:#dfe1e4;--soft:#f5f6f7;--white:#fff;--ok:#1b7a3d;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--soft);font-size:13px;line-height:1.55}
button,input,textarea,select{font:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* buttons */
.btn{min-height:34px;padding:0 16px;border:1px solid #111;background:#fff;color:#111;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
.btn.dark{background:#050505;color:#fff}
.btn.small{min-height:26px;padding:0 10px;font-size:9px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:hover{opacity:.8}

/* logo */
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border:1.5px solid #111;display:grid;place-items:center;font-size:10px;font-weight:800;background:#fff}
.logo-text{font-size:11px;font-weight:800;line-height:1.05}
.logo-text small{display:block;font-size:6.5px;font-weight:600;letter-spacing:1px;margin-top:3px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);padding:32px}
.login-box .logo{margin-bottom:24px}
.login-box h1{font-size:20px;letter-spacing:-.5px;margin-bottom:4px}
.login-box p.sub{color:var(--muted);margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #bfc3c7;background:#fff;padding:9px 10px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#111}
.field textarea{min-height:90px;resize:vertical}
.err{color:var(--bad);font-size:11px;margin-bottom:10px;min-height:14px}
.hint{font-size:11px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}

/* layout */
#app{display:flex;min-height:100vh}
aside{width:230px;background:#050505;color:#fff;padding:22px 0;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
aside .logo{padding:0 20px 22px;border-bottom:1px solid #222}
aside .logo-mark{background:transparent;border-color:#fff}
aside nav{padding:16px 0;flex:1}
aside nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#b9bcc0;padding:11px 20px;font-size:12px;font-weight:600;cursor:pointer;border-left:3px solid transparent}
aside nav button:hover{color:#fff}
aside nav button.active{color:#fff;background:#141414;border-left-color:#fff}
aside .bottom{padding:16px 20px;border-top:1px solid #222}
aside .bottom .btn{width:100%;background:transparent;color:#fff;border-color:#555}
main{flex:1;min-width:0;padding:28px 32px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:22px;letter-spacing:-.6px}
.menu-btn{display:none}

/* cards & tables */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);padding:18px}
.stat span{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.stat strong{display:block;font-size:28px;letter-spacing:-1px;margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);margin-bottom:22px}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h3{font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input,.tools select{border:1px solid #bfc3c7;padding:6px 9px;font-size:12px;outline:none;background:#fff}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:200px}
th{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;font-size:9px;font-weight:700;text-transform:uppercase;border:1px solid}
.badge.new{color:var(--warn);border-color:var(--warn)}
.badge.contacted{color:#1d4ed8;border-color:#1d4ed8}
.badge.closed{color:var(--ok);border-color:var(--ok)}
.badge.live{color:var(--ok);border-color:var(--ok)}
.badge.hidden-b{color:var(--muted);border-color:var(--muted)}
.row-actions{display:flex;gap:6px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.pad{padding:18px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:#fff;width:100%;max-width:480px;padding:24px;max-height:90vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;bottom:20px;right:20px;background:#050505;color:#fff;padding:10px 16px;font-size:12px;z-index:60}

@media(max-width:820px){
  aside{position:fixed;left:-240px;top:0;z-index:40;transition:left .2s}
  aside.open{left:0}
  main{padding:18px}
  .menu-btn{display:inline-flex}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="login-box">
    <div class="logo"><div class="logo-mark">SF</div><div class="logo-text">SHREEJI FIRE<small>SOLUTIONS</small></div></div>
    <h1>Admin Login</h1>
    <p class="sub">Sign in to manage your website.</p>
    <div class="field"><label>Username</label><input id="lu" type="text" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
    <div class="err" id="lerr"></div>
    <button class="btn dark" style="width:100%" id="lbtn">Sign In</button>
    <div class="hint">Default login: <strong>admin</strong> / <strong>admin123</strong><br>Change it after signing in (Settings).</div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="logo"><div class="logo-mark">SF</div><div class="logo-text">SHREEJI FIRE<small>ADMIN PANEL</small></div></div>
    <nav id="nav">
      <button data-p="dashboard" class="active">Dashboard</button>
      <button data-p="inquiries">Inquiries</button>
      <button data-p="services">Services</button>
      <button data-p="projects">Projects</button>
      <button data-p="settings">Settings</button>
    </nav>
    <div class="bottom"><button class="btn" id="logout">Log Out</button></div>
  </aside>

  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn small menu-btn" id="menu">Menu</button>
        <h2 id="title">Dashboard</h2>
      </div>
      <div class="tools" id="topTools"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modalHost"></div>

<script>
(function(){
  /* ---------- storage ---------- */
  var KEY = "sfs_admin_v1";
  var defaults = {
    auth: { user: "admin", pass: "admin123" },
    inquiries: [
      { id: 1, date: "2026-11-15", name: "Rakesh Patel", company: "Patel Industries", phone: "+91 98240 11122", email: "rakesh@patel.in", location: "Rajkot", type: "Industrial", service: "Fire Hydrant System", message: "Need hydrant loop for a new warehouse, 40,000 sq ft.", status: "new" },
      { id: 2, date: "2026-11-12", name: "Meena Shah", company: "Shah Residency", phone: "+91 98980 33445", email: "meena@shah.in", location: "Amreli", type: "Residential", service: "Automatic Sprinkler System", message: "Sprinkler system for a 12-storey building.", status: "contacted" },
      { id: 3, date: "2026-11-05", name: "Jay Mehta", company: "Mehta Complex", phone: "+91 97270 55667", email: "jay@mehta.in", location: "Ahmedabad", type: "Commercial", service: "Fire Alarm System", message: "Quotation for addressable alarm panel.", status: "closed" }
    ],
    services: [
      { id: 1, name: "Fire Hydrant System", desc: "Complete industrial ring main hydrant pipelines, landing valves, hose reels and high-pressure pumps.", live: true },
      { id: 2, name: "Automatic Sprinkler System", desc: "Ceiling-mounted rapid thermal suppression glass sprinkler systems with flow control valves.", live: true },
      { id: 3, name: "Fire Alarm System", desc: "Analogue addressable and conventional heat/smoke detection lines routed to master panels.", live: true },
      { id: 4, name: "Fire Extinguishers", desc: "CO2, dry powder, foam and water cylinders mapped out and maintained regularly.", live: true },
      { id: 5, name: "Fire Pump System", desc: "Jockey pumps, main electric driver pumps and diesel booster back-up stations.", live: true },
      { id: 6, name: "Fire Fighting Pipeline Work", desc: "Underground pipeline loops, steel line welding and system pressure tests.", live: true }
    ],
    projects: [
      { id: 1, name: "Residential High Rise Building", desc: "Fire Hydrant & Sprinkler Installation", live: true },
      { id: 2, name: "Industrial Warehouse", desc: "Complete Loop Piping & Fire Hydrant System", live: true },
      { id: 3, name: "Commercial Complex", desc: "Integrated Alarm System & Wet Risers", live: true }
    ]
  };
  var db;
  function load(){
    try { db = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ db = null; }
    if(!db){ db = JSON.parse(JSON.stringify(defaults)); }
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
  function session(v){ try { if(v===undefined) return sessionStorage.getItem("sfs_in")==="1"; v? sessionStorage.setItem("sfs_in","1") : sessionStorage.removeItem("sfs_in"); } catch(e){ return false; } }
  load();

  /* ---------- helpers ---------- */
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function nextId(arr){ return arr.reduce(function(m,x){return Math.max(m,x.id);},0)+1; }
  function toast(msg){ var t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function download(name, text, type){
    var b = new Blob([text],{type:type}), a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- login ---------- */
  function showApp(){
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); go("dashboard");
  }
  function tryLogin(){
    if($("#lu").value.trim()===db.auth.user && $("#lp").value===db.auth.pass){ session(true); $("#lerr").textContent=""; showApp(); }
    else $("#lerr").textContent = "Wrong username or password.";
  }
  $("#lbtn").onclick = tryLogin;
  $("#lp").addEventListener("keydown",function(e){ if(e.key==="Enter") tryLogin(); });
  $("#logout").onclick = function(){ session(false); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#lp").value=""; };
  $("#menu").onclick = function(){ $("#side").classList.toggle("open"); };

  /* ---------- navigation ---------- */
  var page = "dashboard";
  var filters = { q:"", status:"all" };
  $("#nav").addEventListener("click",function(e){
    var b = e.target.closest("button"); if(!b) return;
    filters = { q:"", status:"all" };
    go(b.dataset.p); $("#side").classList.remove("open");
  });
  function go(p){
    page = p;
    [].forEach.call(document.querySelectorAll("#nav button"),function(b){ b.classList.toggle("active", b.dataset.p===p); });
    var titles = { dashboard:"Dashboard", inquiries:"Inquiries", services:"Services", projects:"Projects", settings:"Settings" };
    $("#title").textContent = titles[p];
    render();
  }

  /* ---------- views ---------- */
  function render(){
    var tt = $("#topTools"); tt.innerHTML = "";
    if(page==="dashboard") dashboard();
    else if(page==="inquiries") inquiries();
    else if(page==="services") listPage("services","Service");
    else if(page==="projects") listPage("projects","Project");
    else settings();
  }

  function dashboard(){
    var q = db.inquiries;
    var n = q.filter(function(x){return x.status==="new";}).length;
    var recent = q.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,5);
    $("#view").innerHTML =
      '<div class="stats">' +
      stat("Total Inquiries", q.length) + stat("New Inquiries", n) +
      stat("Services Live", db.services.filter(function(x){return x.live;}).length) +
      stat("Projects Live", db.projects.filter(function(x){return x.live;}).length) +
      '</div>' +
      '<div class="panel"><div class="panel-head"><h3>Recent Inquiries</h3><button class="btn small" id="viewAll">View All</button></div>' +
      '<div class="table-wrap">' + (recent.length ? '<table><tr><th>Date</th><th>Name</th><th>Service</th><th>Status</th></tr>' +
      recent.map(function(x){ return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.service)+'</td><td>'+badge(x.status)+'</td></tr>'; }).join("") + '</table>' : '<div class="empty">No inquiries yet.</div>') +
      '</div></div>';
    $("#viewAll").onclick = function(){ go("inquiries"); };
  }
  function stat(l,v){ return '<div class="stat"><span>'+l+'</span><strong>'+v+'</strong></div>'; }
  function badge(s){ return '<span class="badge '+s+'">'+s+'</span>'; }

  function inquiries(){
    var tt = $("#topTools");
    tt.innerHTML = '<button class="btn" id="addInq">+ Add Inquiry</button><button class="btn dark" id="csv">Export CSV</button>';
    $("#addInq").onclick = function(){ inquiryForm(); };
    $("#csv").onclick = exportCSV;

    $("#view").innerHTML =
      '<div class="panel"><div class="panel-head"><h3>All Inquiries</h3><div class="tools">' +
      '<input id="fq" placeholder="Search name, phone, email..." value="'+esc(filters.q)+'">' +
      '<select id="fs"><option value="all">All status</option><option value="new">New</option><option value="contacted">Contacted</option><option value="closed">Closed</option></select>' +
      '</div></div><div class="table-wrap" id="inqTable"></div></div>';
    $("#fs").value = filters.status;
    $("#fq").oninput = function(){ filters.q = this.value; drawInq(); };
    $("#fs").onchange = function(){ filters.status = this.value; drawInq(); };
    drawInq();
  }
  function drawInq(){
    var q = filters.q.toLowerCase();
    var rows = db.inquiries.filter(function(x){
      if(filters.status!=="all" && x.status!==filters.status) return false;
      return !q || [x.name,x.company,x.phone,x.email,x.location,x.service,x.message].join(" ").toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){return b.date.localeCompare(a.date);});
    $("#inqTable").innerHTML = rows.length ? '<table><tr><th>Date</th><th>Name</th><th>Contact</th><th>Location</th><th>Service</th><th>Message</th><th>Status</th><th></th></tr>' +
      rows.map(function(x){
        return '<tr><td>'+esc(x.date)+'</td><td><strong>'+esc(x.name)+'</strong><br><span style="color:var(--muted)">'+esc(x.company)+'</span></td>' +
          '<td>'+esc(x.phone)+'<br><span style="color:var(--muted)">'+esc(x.email)+'</span></td>' +
          '<td>'+esc(x.location)+'<br><span style="color:var(--muted)">'+esc(x.type)+'</span></td>' +
          '<td>'+esc(x.service)+'</td><td class="wrap">'+esc(x.message)+'</td>' +
          '<td><select data-st="'+x.id+'"><option value="new">New</option><option value="contacted">Contacted</option><option value="closed">Closed</option></select></td>' +
          '<td><div class="row-actions"><button class="btn small" data-edit="'+x.id+'">Edit</button><button class="btn small danger" data-del="'+x.id+'">Delete</button></div></td></tr>';
      }).join("") + '</table>' : '<div class="empty">No inquiries found.</div>';
    rows.forEach(function(x){ var s=document.querySelector('[data-st="'+x.id+'"]'); if(s) s.value=x.status; });
    [].forEach.call(document.querySelectorAll("[data-st]"),function(s){ s.onchange=function(){ find("inquiries",+s.dataset.st).status=s.value; save(); toast("Status updated"); }; });
    [].forEach.call(document.querySelectorAll("[data-edit]"),function(b){ b.onclick=function(){ inquiryForm(find("inquiries",+b.dataset.edit)); }; });
    [].forEach.call(document.querySelectorAll("[data-del]"),function(b){ b.onclick=function(){ if(confirm("Delete this inquiry?")){ remove("inquiries",+b.dataset.del); drawInq(); toast("Deleted"); } }; });
  }
  function find(k,id){ return db[k].filter(function(x){return x.id===id;})[0]; }
  function remove(k,id){ db[k] = db[k].filter(function(x){return x.id!==id;}); save(); }

  function inquiryForm(item){
    var d = item || { date:today(), name:"", company:"", phone:"", email:"", location:"", type:"", service:"", message:"", status:"new" };
    var opts = db.services.map(function(s){ return '<option'+(s.name===d.service?' selected':'')+'>'+esc(s.name)+'</option>'; }).join("");
    modal(item?"Edit Inquiry":"Add Inquiry",
      f("Full Name","name",d.name)+f("Company","company",d.company)+f("Mobile","phone",d.phone)+f("Email","email",d.email)+
      f("Project Location","location",d.location)+f("Project Type","type",d.type)+
      '<div class="field"><label>Service</label><select id="f_service"><option value="">—</option>'+opts+'</select></div>'+
      '<div class="field"><label>Message</label><textarea id="f_message">'+esc(d.message)+'</textarea></div>',
      function(){
        var v = function(k){ return $("#f_"+k).value.trim(); };
        if(!v("name")){ toast("Name is required"); return false; }
        var o = item || { id:nextId(db.inquiries), date:today(), status:"new" };
        ["name","company","phone","email","location","type","service","message"].forEach(function(k){ o[k]=v(k); });
        if(!item) db.inquiries.push(o);
        save(); drawInq(); toast("Saved"); return true;
      });
  }
  function f(label,key,val){ return '<div class="field"><label>'+label+'</label><input id="f_'+key+'" value="'+esc(val)+'"></div>'; }

  function exportCSV(){
    var cols = ["date","name","company","phone","email","location","type","service","message","status"];
    var rows = [cols.join(",")].concat(db.inquiries.map(function(x){
      return cols.map(function(c){ return '"'+String(x[c]||"").replace(/"/g,'""')+'"'; }).join(",");
    }));
    download("inquiries-"+today()+".csv", "\ufeff"+rows.join("\n"), "text/csv;charset=utf-8");
  }

  /* services / projects */
  function listPage(key,label){
    $("#topTools").innerHTML = '<button class="btn dark" id="addItem">+ Add '+label+'</button>';
    $("#addItem").onclick = function(){ itemForm(key,label); };
    var rows = db[key];
    $("#view").innerHTML = '<div class="panel"><div class="panel-head"><h3>'+label+'s ('+rows.length+')</h3></div><div class="table-wrap">' +
      (rows.length ? '<table><tr><th>Name</th><th>Description</th><th>Website</th><th></th></tr>' +
      rows.map(function(x){
        return '<tr><td><strong>'+esc(x.name)+'</strong></td><td class="wrap">'+esc(x.desc)+'</td>' +
          '<td><span class="badge '+(x.live?'live':'hidden-b')+'">'+(x.live?'Live':'Hidden')+'</span></td>' +
          '<td><div class="row-actions"><button class="btn small" data-tg="'+x.id+'">'+(x.live?'Hide':'Show')+'</button><button class="btn small" data-edit="'+x.id+'">Edit</button><button class="btn small danger" data-del="'+x.id+'">Delete</button></div></td></tr>';
      }).join("") + '</table>' : '<div class="empty">Nothing here yet.</div>') + '</div></div>';
    [].forEach.call(document.querySelectorAll("[data-tg]"),function(b){ b.onclick=function(){ var o=find(key,+b.dataset.tg); o.live=!o.live; save(); listPage(key,label); }; });
    [].forEach.call(document.querySelectorAll("[data-edit]"),function(b){ b.onclick=function(){ itemForm(key,label,find(key,+b.dataset.edit)); }; });
    [].forEach.call(document.querySelectorAll("[data-del]"),function(b){ b.onclick=function(){ if(confirm("Delete this "+label.toLowerCase()+"?")){ remove(key,+b.dataset.del); listPage(key,label); toast("Deleted"); } }; });
  }
  function itemForm(key,label,item){
    var d = item || { name:"", desc:"", live:true };
    modal((item?"Edit ":"Add ")+label,
      f("Name","name",d.name)+'<div class="field"><label>Description</label><textarea id="f_desc">'+esc(d.desc)+'</textarea></div>'+
      '<div class="field"><label>Show on website</label><select id="f_live"><option value="1">Live</option><option value="0">Hidden</option></select></div>',
      function(){
        var name = $("#f_name").value.trim();
        if(!name){ toast("Name is required"); return false; }
        var o = item || { id:nextId(db[key]) };
        o.name = name; o.desc = $("#f_desc").value.trim(); o.live = $("#f_live").value==="1";
        if(!item) db[key].push(o);
        save(); listPage(key,label); toast("Saved"); return true;
      });
    $("#f_live").value = d.live ? "1" : "0";
  }

  /* settings */
  function settings(){
    $("#view").innerHTML =
      '<div class="settings-grid">' +
      '<div class="panel"><div class="panel-head"><h3>Change Login</h3></div><div class="pad">' +
      '<div class="field"><label>New Username</label><input id="s_user" value="'+esc(db.auth.user)+'"></div>' +
      '<div class="field"><label>Current Password</label><input id="s_old" type="password"></div>' +
      '<div class="field"><label>New Password (min 6 characters)</label><input id="s_new" type="password"></div>' +
      '<button class="btn dark" id="s_save">Update Login</button></div></div>' +
      '<div class="panel"><div class="panel-head"><h3>Backup &amp; Data</h3></div><div class="pad">' +
      '<p style="color:var(--muted);margin-bottom:12px">Data is saved in this browser only. Download a backup to keep it safe or move it to another computer.</p>' +
      '<div class="tools"><button class="btn" id="bk">Download Backup</button><button class="btn" id="rs">Restore Backup</button>' +
      '<button class="btn danger" id="rt">Reset All Data</button></div>' +
      '<input type="file" id="rsFile" accept=".json" class="hidden"></div></div>' +
      '</div>';
    $("#s_save").onclick = function(){
      if($("#s_old").value!==db.auth.pass){ toast("Current password is wrong"); return; }
      if(!$("#s_user").value.trim() || $("#s_new").value.length<6){ toast("Enter a username and a 6+ character password"); return; }
      db.auth = { user:$("#s_user").value.trim(), pass:$("#s_new").value }; save(); toast("Login updated"); settings();
    };
    $("#bk").onclick = function(){ download("shreeji-admin-backup-"+today()+".json", JSON.stringify(db,null,2), "application/json"); };
    $("#rs").onclick = function(){ $("#rsFile").click(); };
    $("#rsFile").onchange = function(){
      var file = this.files[0]; if(!file) return;
      var r = new FileReader();
      r.onload = function(){ try { var d = JSON.parse(r.result); if(!d.inquiries||!d.services||!d.projects||!d.auth) throw 0; db=d; save(); toast("Backup restored"); settings(); } catch(e){ toast("Invalid backup file"); } };
      r.readAsText(file);
    };
    $("#rt").onclick = function(){ if(confirm("Reset everything to the default data?")){ db = JSON.parse(JSON.stringify(defaults)); save(); toast("Data reset"); settings(); } };
  }

  /* modal */
  function modal(title, body, onSave){
    var host = $("#modalHost");
    host.innerHTML = '<div class="modal-bg"><div class="modal"><h3>'+title+'</h3>'+body+'<div class="actions"><button class="btn" id="mc">Cancel</button><button class="btn dark" id="ms">Save</button></div></div></div>';
    var close = function(){ host.innerHTML = ""; };
    $("#mc").onclick = close;
    $("#ms").onclick = function(){ if(onSave()!==false) close(); };
    host.firstChild.onclick = function(e){ if(e.target===host.firstChild) close(); };
  }

  if(session()) showApp();
})();
</script>
</body>
</html>
